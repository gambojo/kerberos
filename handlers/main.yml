---
- name: RESTART MASTER SERVER
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
    enabled: true
  when: inventory_hostname in krb_master_group
  loop:
    - "{{ krb_kdc_service }}"
    - "{{ krb_kadmind_service }}"

- name: RESTART SLAVE SERVER
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
    enabled: true
  when: inventory_hostname in krb_replica_group
  loop:
    - "{{ krb_kdc_service }}"
    - "{{ krb_kpropd_service }}"
